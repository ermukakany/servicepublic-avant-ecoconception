name: Mesure EcoIndex - AVANT

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ecoindex:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer EcoIndex CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install ecoindex-cli
          python -m playwright install chromium

      - name: Vérifier EcoIndex CLI
        run: |
          ecoindex-cli --help
          ecoindex-cli analyze --help

      - name: Installer le serveur
        run: |
          npm install -g http-server

      - name: Lancer le serveur local
        run: |
          http-server . -p 8080 &
          sleep 5

      - name: Mesurer avec EcoIndex
        run: |
          ecoindex-cli analyze --url http://localhost:8080 --output-file ecoindex-results.json --no-interaction

      - name: Afficher les résultats EcoIndex
        run: |
          cat ecoindex-results.json

      - name: Sauvegarder les résultats
        uses: actions/upload-artifact@v4
        with:
          name: ecoindex-avant
          path: ecoindex-results.json
